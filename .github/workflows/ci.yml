name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
        env: {TG_DATABASE_URL: 'sqlite:///./ci.db', TG_SECRET_KEY: 'ci-only-test-secret'}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          TG_SECRET_KEY: ci-only-test-secret
      - name: Build API, MLflow, and frontend images
        run: docker compose build api web
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          TG_SECRET_KEY: ci-only-test-secret
