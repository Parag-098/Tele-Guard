name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
        env: {TG_DATABASE_URL: 'sqlite:///./ci.db', TG_SECRET_KEY: 'ci-only-test-secret'}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          TG_SECRET_KEY: ci-only-test-secret
      - name: Build API, MLflow, and frontend images
        run: docker compose build api web
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          TG_SECRET_KEY: ci-only-test-secret
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - name: Build production frontend with same-origin API path
        run: docker build --build-arg VITE_API_URL=/api -t teleguard-web:production-check ./frontend
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ECR_REGISTRY }}/teleguard-api:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          build-args: VITE_API_URL=/api
          tags: ${{ vars.ECR_REGISTRY }}/teleguard-web:${{ github.sha }}
      - name: Deploy immutable release through SSM
        shell: bash
        env:
          DEPLOY_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TeleGuard release $RELEASE_SHA" \
            --parameters "commands=[\"sudo /opt/teleguard/deploy-release.sh $RELEASE_SHA\"]" \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            if [[ "$status" == "Success" ]]; then
              aws ssm get-command-invocation --command-id "$command_id" \
                --instance-id "$DEPLOY_INSTANCE_ID" --query StandardOutputContent --output text
              exit 0
            fi
            if [[ "$status" == "Failed" || "$status" == "Cancelled" || "$status" == "TimedOut" ]]; then
              aws ssm get-command-invocation --command-id "$command_id" \
                --instance-id "$DEPLOY_INSTANCE_ID" --output json
              exit 1
            fi
            sleep 10
          done
          echo "SSM deployment command did not finish within 10 minutes" >&2
          exit 1
