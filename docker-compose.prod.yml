name: teleguard-production

x-logs: &cloudwatch
  driver: awslogs
  options: &cloudwatch-options
    awslogs-region: ${AWS_REGION:-ap-south-1}
    awslogs-group: /teleguard/production
    awslogs-create-group: "false"
    awslogs-force-flush-interval-seconds: "5"

x-runtime: &runtime
  TG_DATABASE_URL: ${TG_DATABASE_URL:?Set URL-encoded TG_DATABASE_URL}
  TG_SECRET_KEY: ${TG_SECRET_KEY:?Set TG_SECRET_KEY in .env.production}
  TG_MODEL_PATH: /app/artifacts/fraud-model.joblib
  TG_CORS_ORIGINS: https://${TG_DOMAIN:?Set TG_DOMAIN}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}

services:
  db:
    image: ${TG_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: teleguard
      POSTGRES_USER: teleguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./deploy-state/postgres:/var/lib/postgresql/data
      - ${TG_RELEASE_DIR:-.}/deploy/init-mlflow-db.sh:/docker-entrypoint-initdb.d/01-mlflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teleguard -d teleguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: postgres

  mlflow:
    image: ${TG_API_IMAGE:-${ECR_REGISTRY:?Set ECR_REGISTRY}/teleguard-api:${RELEASE_TAG:?Set RELEASE_TAG}}
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow:5000,localhost:*
      - --backend-store-uri
      - ${MLFLOW_BACKEND_STORE_URI:?Set MLFLOW_BACKEND_STORE_URI}
      - --serve-artifacts
      - --artifacts-destination
      - s3://${MLFLOW_ARTIFACT_BUCKET:?Set MLFLOW_ARTIFACT_BUCKET}/mlflow
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 15
    expose: ["5000"]
    restart: unless-stopped
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: mlflow

  api:
    image: ${TG_API_IMAGE:-${ECR_REGISTRY:?Set ECR_REGISTRY}/teleguard-api:${RELEASE_TAG:?Set RELEASE_TAG}}
    environment:
      <<: *runtime
      TG_ENABLE_API_DOCS: "false"
      TG_ADMIN_USERNAME: ${TG_ADMIN_USERNAME:-}
      TG_ADMIN_PASSWORD: ${TG_ADMIN_PASSWORD:-}
      TG_API_WORKERS: ${TG_API_WORKERS:-2}
    volumes:
      - ./deploy-state/models:/app/artifacts
    depends_on:
      db: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 15
    expose: ["8000"]
    restart: unless-stopped
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: api

  worker:
    image: ${TG_API_IMAGE:-${ECR_REGISTRY:?Set ECR_REGISTRY}/teleguard-api:${RELEASE_TAG:?Set RELEASE_TAG}}
    command: ["python", "-m", "app.worker"]
    environment: *runtime
    volumes:
      - ./deploy-state/models:/app/artifacts
    depends_on:
      api: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket
          from datetime import datetime, timezone
          from app.db import SessionLocal
          from app.models import ServiceHeartbeat
          with SessionLocal() as db:
              heartbeat = db.get(ServiceHeartbeat, "worker")
              assert heartbeat and heartbeat.instance_id == socket.gethostname()
              assert heartbeat.status == "healthy" and (datetime.now(timezone.utc) - heartbeat.updated_at).total_seconds() < 90
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: worker

  web:
    image: ${TG_WEB_IMAGE:-${ECR_REGISTRY:?Set ECR_REGISTRY}/teleguard-web:${RELEASE_TAG:?Set RELEASE_TAG}}
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: web

  proxy:
    image: ${TG_CADDY_IMAGE:-caddy:2.10-alpine}
    environment:
      TG_DOMAIN: ${TG_DOMAIN:?Set TG_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${TG_RELEASE_DIR:-.}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy-state/caddy:/data
      - ./deploy-state/caddy-config:/config
    depends_on:
      web: {condition: service_started}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      <<: *cloudwatch
      options:
        <<: *cloudwatch-options
        awslogs-stream: proxy
