[project]
name = "teleguard-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.0", "sqlalchemy==2.0.39",
  "alembic==1.15.1", "psycopg[binary]==3.2.6", "pydantic-settings==2.8.1",
  "scikit-learn==1.6.1", "pandas==2.2.3", "numpy==2.2.3", "networkx==3.4.2",
  "joblib==1.4.2", "python-jose[cryptography]==3.4.0", "pwdlib[argon2]==0.2.1",
  "mlflow==2.21.2"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.2"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
