[project]
name = "teleguard-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.165.0", "uvicorn[standard]==0.34.0", "sqlalchemy==2.0.39",
  "alembic==1.15.1", "psycopg[binary]==3.2.6", "psycopg2-binary==2.9.13", "pydantic-settings==2.8.1",
  "scikit-learn==1.6.1", "pandas==2.2.3", "numpy==2.2.3", "networkx==3.4.2",
  "joblib==1.4.2", "PyJWT==2.15.1", "pwdlib[argon2]==0.2.1",
  "mlflow==3.18.0", "shap==0.49.1", "boto3==1.37.18"
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx2==2.16.2", "ruff==0.11.2", "pip-audit==2.10.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
